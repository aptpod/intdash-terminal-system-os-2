# CVE Status
# Ingore the check for a given list of CVEs. If a CVE is found,
# then it is considered patched.
#
# TS_CVE_IGNORE: CVE exclusion list shared by both scarthgap and kirkstone
# CVE_CHECK_IGNORE: for kirkstone (4.0)

TS_CVE_IGNORE = " \
    CVE-2023-0687 \
    CVE-2023-5178 \
    CVE-2026-23112 \
    CVE-2023-47100 \
    CVE-2022-36648 \
    CVE-2024-3566 \
    CVE-2025-68121 \
    CVE-2024-52533 \
    CVE-2025-32463 \
    CVE-2025-6965 \
    CVE-2025-67268 \
    CVE-2025-37924 \
"

CVE_CHECK_IGNORE:append = " ${TS_CVE_IGNORE}"

# CVE-2023-0687:
#   Call Graph Monitorは使用していないので非該当
# CVE-2023-5178 CVE-2026-23112:
#   NVMe over TCP ターゲット (nvmet-tcp) の境界チェック欠如。ストレージをネットワーク公開する機能であり、
#   Terminal Systemではこの機能を使用していないので非該当
# CVE-2023-47100:
#   Perlは使用していないので非該当
# CVE-2022-36648:
#   対象のコードはビルド時に使うqemu-nativeでしか使っておらず、qemu-nativeは社内LANのビルドマシンで動作するので非該当
# CVE-2024-3566:
#   Windows onlyのコマンドインジェクション。Linux環境では非該当（poky upstream でも除外済み）
# CVE-2025-68121:
#   Go crypto/tls のセッション再開時に RootCAs/ClientCAs を動的変更した場合のみ影響する証明書検証バイパス。
#   イメージ内で Go ビルドされるのは zabbix-agent2 のみで、zabbix-agent2 は Go 標準の crypto/tls を
#   使用せず CGo 経由の OpenSSL 独自実装（セッション再利用も無効化済み）を使用しており非該当
# CVE-2024-52533:
#   glib-2.0のSOCKS4aプロキシ接続時のバッファオーバーフロー。Terminal SystemではSOCKSプロキシを使用しないため非該当
# CVE-2025-32463:
#   sudoのchroot内でのresolv.conf経由の権限昇格。Terminal Systemではchroot環境でsudoを使用しないため非該当
# CVE-2025-6965:
#   SQLite集約関数の項数超過によるメモリ破壊。攻撃には悪意のあるSQLクエリの実行が必要。
#   Terminal SystemのSQLiteは内部DBとしてのみ使用し、外部からの任意SQLクエリを受け付けないため非該当
# CVE-2025-67268:
#   gpsdのJSON解析時バッファオーバーフロー。gpsdはlocalhost:2947でリッスンしており外部ネットワークに公開していないため非該当
# CVE-2025-37924:
#   ksmbd (カーネルSMBサーバー) のKerberos認証時use-after-free。
#   カーネルコンフィグでCONFIG_SMB_SERVERが無効であり、ksmbd モジュールはビルドに含まれないため非該当

CVE_CHECK_REPORT_PATCHED="0"
