# CVE Status
# Ingore the check for a given list of CVEs. If a CVE is found,
# then it is considered patched.
#
# TS_CVE_IGNORE: CVE exclusion list shared by both scarthgap and kirkstone
# CVE_STATUS_GROUPS: for scarthgap (5.0+)
# CVE_CHECK_IGNORE: for kirkstone (4.0) - set in target-specific cve.conf

TS_CVE_IGNORE = " \
    CVE-2023-0687 \
    CVE-2023-5178 \
    CVE-2026-23112 \
    CVE-2023-47100 \
    CVE-2022-36648 \
    CVE-2024-3566 \
    CVE-2025-68121 \
    CVE-2024-52533 \
    CVE-2025-15467 \
    CVE-2025-6965 \
    CVE-2026-22184 \
    CVE-2025-67268 \
    CVE-2025-32463 \
    CVE-2022-48174 \
    CVE-2024-40896 \
    CVE-2024-12084 \
    CVE-2025-3277 \
    CVE-2025-37924 \
    CVE-2025-39946 \
"

CVE_STATUS_GROUPS:append = " CVE_STATUS_NOT_USED"
CVE_STATUS_NOT_USED = "${TS_CVE_IGNORE}"
CVE_STATUS_NOT_USED[status] = "not-applicable-platform: Not used"

# CVE-2023-0687:
#   Call Graph Monitorは使用していないので非該当
# CVE-2023-5178 CVE-2026-23112:
#   NVMe over TCP ターゲット (nvmet-tcp) の境界チェック欠如。ストレージをネットワーク公開する機能であり、
#   Terminal Systemではこの機能を使用していないので非該当
# CVE-2023-47100:
#   Perlは使用していないので非該当
# CVE-2022-36648:
#   対象のコードはビルド時に使うqemu-nativeでしか使っておらず、qemu-nativeは社内LANのビルドマシンで動作するので非該当
# CVE-2024-3566:
#   Windows onlyのコマンドインジェクション。Linux環境では非該当（poky upstream でも除外済み）
# CVE-2025-68121:
#   Go crypto/tls のセッション再開時に RootCAs/ClientCAs を動的変更した場合のみ影響する証明書検証バイパス。
#   イメージ内で Go ビルドされるのは zabbix-agent2 のみで、zabbix-agent2 は Go 標準の crypto/tls を
#   使用せず CGo 経由の OpenSSL 独自実装（セッション再利用も無効化済み）を使用しており非該当
# CVE-2024-52533:
#   glib-2.0のSOCKS4aプロキシ接続時のバッファオーバーフロー。Terminal SystemではSOCKSプロキシを使用しないため非該当
# CVE-2025-15467:
#   OpenSSL CMS AuthEnvelopedData解析時のスタックバッファオーバーフロー。
#   Terminal SystemではCMS API（CMS_decrypt等）を使用するアプリケーションが存在しないため非該当
# CVE-2025-6965:
#   SQLite集約関数の項数超過によるメモリ破壊。攻撃には悪意のあるSQLクエリの実行が必要。
#   Terminal SystemのSQLiteは内部DBとしてのみ使用し、外部からの任意SQLクエリを受け付けないため非該当
# CVE-2026-22184:
#   zlibのcontrib/untgzユーティリティのバッファオーバーフロー。zlibコアライブラリには影響なし。
#   Yoctoビルドではcontrib/untgzはパッケージングされない。CVE自体もdisputed
# CVE-2025-67268:
#   gpsdのJSON解析時バッファオーバーフロー。gpsdはlocalhost:2947でリッスンしており外部ネットワークに公開していないため非該当
# CVE-2025-32463:
#   sudoのchroot内でのresolv.conf経由の権限昇格。Terminal Systemではchroot環境でsudoを使用しないため非該当
# CVE-2022-48174:
#   busyboxのash算術展開における境界外書き込み。Terminal Systemではbusyboxのashを外部入力の評価に使用しないため非該当
# CVE-2024-40896:
#   libxml2のSAX解析時にXXE攻撃が可能。Terminal Systemでは外部からの任意XMLを解析しないため非該当
# CVE-2024-12084:
#   rsyncのチェックサム長処理時ヒープオーバーフロー。rsync-nativeはビルド環境のみで製品には含まれない
# CVE-2025-3277:
#   sqlite3のconcat関数での型混同によるメモリ破壊。外部SQL入力なし。内部DB用途のみ
# CVE-2025-37924:
#   ksmbd (カーネルSMBサーバー) のKerberos認証時use-after-free。
#   カーネルコンフィグでCONFIG_SMB_SERVERが無効であり、ksmbd モジュールはビルドに含まれないため非該当
# CVE-2025-39946:
#   kTLS (カーネルTLSオフロード) の不正ヘッダによるバッファオーバーフロー。
#   カーネルコンフィグでCONFIG_TLSが無効であり、kTLS モジュールはビルドに含まれないため非該当

CVE_CHECK_REPORT_PATCHED="0"
