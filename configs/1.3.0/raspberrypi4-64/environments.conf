## target arch
TS_TARGET_GOOS="linux"
TS_TARGET_GOARCH="arm64"
TS_TARGET_DEB_ARCH="arm64"
## device connector
TS_DISTRO_NAME_DEVICE_CONNECTOR="debian"
TS_DISTRO_VERSION_DEVICE_CONNECTOR="12"
TS_DISTRO_CODENAME_DEVICE_CONNECTOR="bookworm"
TS_BASE_IMAGE_DEVICE_CONNECTOR="${TS_DISTRO_NAME_DEVICE_CONNECTOR}:${TS_DISTRO_VERSION_DEVICE_CONNECTOR}"
TS_IMAGE_NAME_DEVICE_CONNECTOR="device-connector-intdash/raspberrypi4-64"
TS_INSTALL_PACKAGES_DEVICE_CONNECTOR="gstreamer1.0-libcamera,libcamera-ipa"
## extra apt repository (for Camera Module 3 support)
## format: URL,distribution,component (comma-separated, no spaces)
TS_APT_EXTRA_REPO_DEVICE_CONNECTOR="http://archive.raspberrypi.com/debian/,${TS_DISTRO_CODENAME_DEVICE_CONNECTOR},main"
TS_APT_EXTRA_REPO_KEY_DEVICE_CONNECTOR="http://archive.raspberrypi.com/debian/raspberrypi.gpg.key"
TS_APT_EXTRA_REPO_PIN_PACKAGES_DEVICE_CONNECTOR="gstreamer1.0-libcamera,libcamera*"

